name: Selenium Daily Execution

on:
  schedule:
    # 12:00 AM IST Daily
    - cron: '30 18 * * *'

  workflow_dispatch:

jobs:
  selenium-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@latest

      - name: Run Selenium Tests
        run: mvn clean test

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: selenium-report
          path: SeleniumSimple/reports/*.html

      - name: Send Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: sumit666mohapatra@gmail.com
          password: ${{ secrets.EMAIL_PASSWORD }}


          subject: Daily Selenium Automation Report

          to: sumit666mohapatra@gmail.com
          from: GitHub Actions

          body: |
            Selenium execution completed successfully.
            Latest report is attached.

          attachments: SeleniumSimple/reports/*.html