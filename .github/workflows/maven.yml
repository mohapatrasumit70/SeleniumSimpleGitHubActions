name: Selenium Daily Execution

on:
  schedule:
    - cron: '30 18 * * *'   # 12:00 AM IST

  workflow_dispatch:

jobs:
  selenium-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@latest

      # FIX 1: If pom.xml is in the root, remove/comment out the working-directory line.
      # If it IS in a subfolder, make sure the folder name matches exactly (case-sensitive).
      - name: Run Selenium Tests
        # working-directory: SeleniumSimple 
        run: mvn clean test -DsuiteXmlFile=src/test/resources/testng.xml

      # FIX 2: Corrected artifact path if your project is at the root level
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-report
          path: reports/*.html

      # FIX 3: Perfectly aligned spaces for the mail plugin
      - name: Send Email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Daily Selenium Automation Report
          to: sumitkumarmohapatra21@gmail.com
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
            Selenium execution completed successfully.
            Latest report is attached.
          attachments: reports/*.html
          
